# Populate Playbook: Credential Exposure

playbook_id: PB-001
title: Credential Exposure - Phished Microsoft Credentials With Attacker Sign-in
owner_role: IR_Commander

applies_to:
  triggers:
    - User reports entering credentials on a fake Microsoft login page
    - Splunk or Azure AD Identity Protection alert - successful sign-in from a foreign IP or country new to the user, confirmed not the user
  indicators:
    - Successful Azure AD sign-in from a foreign IP or ASN, MFA satisfied
    - New MFA method, inbox rule, forwarding address or OAuth consent on the account
    - VPN login or Epic access under the user's ID from an unusual IP, workstation or patient set
    - Lookalike Microsoft login URL in the phishing email or proxy logs

severity_mapping:
  initial: SEV2
  escalate_if:
    - Attacker access to ePHI is broad (many patients or bulk export)
    - Account is privileged or a second account is compromised
    - Clinical systems are degraded by the attacker or by containment

immediate_actions:
  - step: Declare SEV2, assign the Scribe, start the incident log in UTC
    owner: IR_Commander
    timebox_minutes: 2
  - step: Confirm the foreign sign-in in the Azure AD sign-in log and record every attacker IP
    owner: Technical_Lead
    timebox_minutes: 3
  - step: Phone the user on a directory number (not email) to confirm the click and stop using the account. Set the exposure window start and list what the account can reach (Epic role, VPN, mailbox, privileged or not)
    owner: Technical_Lead
    timebox_minutes: 3
  - step: Capture all evidence_preservation items, volatile logs first. No containment before this is done
    owner: Technical_Lead
    timebox_minutes: 5
  - step: Make and log the reset-or-monitor decision (see containment step 1)
    owner: IR_Commander
    timebox_minutes: 2

evidence_preservation:
  - artifact: Active Directory authentication logs for the user (events 4624, 4625, 4740, 4768, 4769, 4771)
    method: Splunk export to CSV plus wevtutil epl of the Security log on each domain controller
    before_step: Reset Active Directory password
  - artifact: Azure AD sign-in and audit log export for the user, 7 days before the exposure window to now
    method: Entra portal download or Microsoft Graph export to JSON (logs are kept about 30 days)
    before_step: Revoke Azure AD sessions
  - artifact: Affected mailbox export with inbox rules, forwarding, delegates and the original phishing email
    method: Purview content search and PST export, plus Get-InboxRule and Get-Mailbox output saved as text
    before_step: Revoke Azure AD sessions
  - artifact: Registered MFA methods and device registrations with timestamps
    method: Microsoft Graph authentication methods listing saved as JSON
    before_step: Reset MFA devices
  - artifact: Recent data access audit - Epic access audit for the user ID (patients, workstation, timestamps) and Microsoft 365 unified audit log for the exposure window
    method: Epic security team exports the access report to CSV, Purview audit log search exported. The patient list feeds the HIPAA assessment
    before_step: Terminate Epic sessions
  - artifact: VPN session records for the user (source IP, start and end times)
    method: Export from the VPN gateway and matching Splunk events
    before_step: Revoke VPN tokens

containment_actions:
  - step: Decide containment timing - reset immediately or monitor briefly
    owner: IR_Commander
    decision_point: >-
      Default is reset immediately. Reset now if the attacker is in Epic or any ePHI system, any bulk
      read or export is seen, the account is privileged, or the attacker registered an MFA method or
      forwarding rule. Monitor only if ALL hold - evidence captured, no ePHI access seen, account not
      privileged, Technical_Lead watching sign-ins and the Epic audit live, IR_Commander approval
      logged. Monitoring stops at 15 minutes or on any trigger above. If SEV1, the Executive_Sponsor decides.
    trade_off: >-
      Reset now stops further access and limits ePHI exposure, but cuts off the attacker and loses live
      visibility into their goals and persistence. Monitoring shows scope, but risks more patient data
      access, exfiltration and persistence, and widens the HIPAA exposure window.
  - step: Reset Active Directory password
    owner: Technical_Lead
    decision_point: Only after evidence is captured. Force an Azure AD Connect delta sync afterwards
    trade_off: Invalidates the stolen password for AD, Epic and VPN, but not open sessions or issued tokens, so steps 3 to 6 follow at once. User is locked out until given a temporary password by phone
  - step: Revoke Azure AD sessions
    owner: Technical_Lead
    decision_point: Confirm the delta sync finished first, so the old password cannot be reused
    trade_off: Signs the attacker out of Microsoft 365 (Revoke-MgUserSignInSession) and the user from all devices. Issued access tokens may last about an hour, so check recovery_validation
  - step: Reset MFA devices
    owner: Technical_Lead
    decision_point: User re-registers only after in-person or video identity check with their manager, never by phone or ticket alone
    trade_off: Deletes attacker-registered methods and their persistence, but the user cannot sign in until re-enrolled
  - step: Revoke VPN tokens
    owner: Technical_Lead
    decision_point: Skip only if the user has no VPN entitlement
    trade_off: Ends any attacker VPN session and invalidates the token, but the user loses remote access until reissued after identity verification
  - step: Terminate Epic sessions
    owner: Technical_Lead
    decision_point: >-
      If the user is a clinician on shift, the IR_Commander first calls the unit charge nurse to cover
      patient care. If the Epic audit shows bulk chart access, terminate immediately and run in parallel
      with step 2.
    trade_off: Ends the attacker's live ePHI access on epic.meddefense.local, but may interrupt a clinician and lose unsaved notes or open orders, a patient safety risk handled through the charge nurse
  - step: Block phishing domain and sender
    owner: Technical_Lead
    decision_point: After phishing evidence is captured. Block at proxy, DNS and email gateway
    trade_off: Stops other users reaching the page, but tells the attacker it was found, so they may switch domains. Hunt for the next one

eradication_actions:
  - Delete attacker inbox rules, forwarding addresses, delegates and mail flow rules
  - Remove malicious OAuth consents, app passwords and attacker-registered devices (Azure AD, Intune)
  - Find every user who visited the phishing URL or got the email, reset and revoke those who submitted credentials, and purge the email from all mailboxes
  - Reset the password on other systems where the user reused it (LIS, Nexus Patient Scheduling)
  - Run a Wazuh scan on the user's clinical workstation and reimage if malware is found
  - Report the phishing domain for takedown and add it to the Splunk and email gateway blocklists

recovery_validation:
  - check: Azure AD sign-ins for the user after revocation plus 60 minutes
    criterion: No successful sign-in from attacker IPs or any unknown device or location for 72 hours
  - check: Registered MFA methods
    criterion: Only methods the user registered after identity verification
  - check: Mailbox rules, forwarding, delegates and OAuth consents
    criterion: Only the pre-incident baseline remains
  - check: Epic sessions, access audit and VPN sessions for the user after termination
    criterion: Nothing except the user's own verified sessions, and the old VPN token is rejected
  - check: Phishing domain test and Wazuh result for the workstation
    criterion: Domain blocked with no new hits, workstation clean
  - check: User confirms access to email, Epic and VPN
    criterion: Normal clinical work resumed and no Splunk flags for 72 hours

communication_plan:
  - audience: Affected user and their manager
    trigger: First phone call, and again to hand over the temporary password after MFA re-enrollment
    template: tmpl_credential_reset_user_notice.md
  - audience: Unit charge nurse or department manager
    trigger: Before Epic session termination when the user is on shift
    template: tmpl_clinical_unit_epic_session_notice.md
  - audience: Legal_Liaison (Helena Reyes, General Counsel)
    trigger: HIPAA assessment trigger - ePHI was accessible from the account in the exposure window or this cannot be ruled out, within 60 minutes of declaration
    template: tmpl_legal_hipaa_assessment_request.md
  - audience: IT helpdesk
    trigger: After the MFA reset, so staff verify identity in person or by video only
    template: tmpl_helpdesk_identity_verification_alert.md
  - audience: Executive_Sponsor (Dr. Patricia Morales, CISO)
    trigger: Severity rises to SEV1, account is privileged, or broad ePHI access is confirmed
    template: tmpl_exec_briefing_security_incident.md
  - audience: All staff, sent by the Communications_Lead after Legal_Liaison approval
    trigger: After containment, to warn about the phishing campaign
    template: tmpl_all_staff_phishing_advisory.md

escalation_triggers:
  - >-
    HIPAA assessment trigger - was ePHI accessible from the compromised account during the exposure
    window (credentials entered until credentials and sessions invalidated)? If yes or unknown, notify
    the Legal_Liaison within 60 minutes and start the breach risk assessment from the Epic audit patient
    list. The Legal_Liaison sets HIPAA, Oregon and Washington deadlines
  - Attacker access to ePHI confirmed in the Epic or Microsoft 365 audit - raise to SEV1 and notify the Executive_Sponsor
  - Privileged account or a second compromised account - raise to SEV1
  - Attacker signs in again after reset and revocation - tokens or persistence missed, escalate to the Executive_Sponsor and the IR retainer
  - No containment progress 60 minutes after declaration (SEV2 time threshold)

post_incident_tasks:
  - Legal_Liaison records the HIPAA risk assessment and breach determination with the Epic patient list
  - Scribe hands the timeline, decision log (including reset-or-monitor) and evidence hashes to the review
  - Add Splunk detections for a new-country sign-in after a phishing report and a new MFA method after a foreign sign-in
  - Add Conditional Access country blocking and move clinical-access MFA from push to number matching or phishing-resistant methods
  - Run phishing follow-up with the user's unit, and create the communication templates named above

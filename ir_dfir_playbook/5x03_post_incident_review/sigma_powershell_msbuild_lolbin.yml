title: PowerShell Spawning Trusted Developer Utility (LOLBin Proxy Execution)
id: 35164b3d-411e-4e8c-b813-148d66c8b5e0
status: test
description: |
    Detects msbuild.exe, csc.exe, vbc.exe or jsc.exe launched directly by PowerShell, pwsh, wscript or cscript.
    Developer utilities that compile and run inline code (MSBuild inline tasks, Roslyn compilers) are used as
    proxies to execute payloads without a dropped executable (T1127.001). Observed in IR-2026-0414-01 on WST-WS-031
    at 2026-04-14T02:46:58Z, where powershell.exe spawned MSBuild.exe against update.xml (an inline C# task) from a user
    Temp directory, followed by outbound C2 on 443. The detection did not exist before this incident.
references:
    - https://lolbas-project.github.io/lolbas/Binaries/Msbuild/
    - https://lolbas-project.github.io/lolbas/Binaries/Csc/
    - https://attack.mitre.org/techniques/T1127/001/
    - https://attack.mitre.org/techniques/T1059/001/
    - 5x03_post_incident_review/gap_analysis.md (GAP-006, GAP-008)
    - 5x03/forensic_findings_summary.md (ART-002-M01, ART-001-E01)
author: massimu
date: 2026-10-19
tags:
    - attack.execution
    - attack.t1127.001
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    selection_child:
        Image|endswith:
            - '\MSBuild.exe'
            - '\csc.exe'
            - '\vbc.exe'
            - '\jsc.exe'
    condition: selection_parent and selection_child
falsepositives:
    - PowerShell build or deployment scripts that call MSBuild.exe directly for a solution build, for example a deploy script under C:\src\deploy run from an engineer's shell or a scheduled task
    - Package restore or code-generation scripts (PowerShell wrapping Roslyn csc.exe or vbc.exe) run by developers or CI agents on build hosts
level: high
